name: patient_app
description: Smriti Kunj — patient-facing Flutter app for SIH-PS003.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # flutter_tts: ^3.8.3
  # State management (Provider — see AGENTS.md §3)
  provider: ^6.1.2

  # HTTP — for api_service.dart stubs / future real calls
  http: ^1.2.2

  # Local persistence — game session queue (sqflite + path)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # SVG rendering — for in-app logo display (flutter_svg)
  flutter_svg: ^2.0.10+1

  tflite_flutter: ^0.10.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/NotoSans-Italic-VariableFont_wdth,wght.ttf
          style: italic
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-VariableFont_wdth,wght.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont_wdth,wght.ttf

  assets:
    - assets/images/
    - assets/icon/
    - assets/audio/
    - assets/data/
    - assets/models/
    - agents/difficulty_mlp_ucb1.tflite


# ── Launcher Icon Configuration ───────────────────────────────────────────────
# Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#B5562F"
  adaptive_icon_foreground: "assets/icon/logo.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
